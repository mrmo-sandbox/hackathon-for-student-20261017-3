<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#16684b">
    <title>課題の締切</title>
    <link rel="stylesheet" href="/style.css">
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <header class="topbar"><span class="brand">課題の締切</span><time id="today"></time></header>
    <main>
      <section class="entry" aria-labelledby="entry-heading">
        <h1 id="entry-heading">課題を追加</h1>
        <form id="task-form" novalidate>
          <div class="field title-field"><label for="title">課題名</label><input id="title" name="title" type="text" required autocomplete="off"></div>
          <div class="field"><label for="due">締切日</label><input id="due" name="due" type="date" required></div>
          <button class="add-button" type="submit">追加</button>
        </form>
        <p id="error" role="alert"></p>
      </section>
      <section class="tasks" aria-labelledby="list-heading">
        <div class="section-heading"><h2 id="list-heading">未完了の課題</h2><span id="count">0件</span></div>
        <p id="empty">未完了の課題はありません。</p>
        <ul id="task-list"></ul>
        <p id="status" role="status" aria-live="polite"></p>
      </section>
    </main>
  </body>
</html>
